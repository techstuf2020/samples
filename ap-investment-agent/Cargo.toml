[package]
name = "ap-investment-agent"
version = "0.1.0"
edition = "2024"
description = "Weekly research report on where Andhra Pradesh is investing, emailed via Gmail"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
